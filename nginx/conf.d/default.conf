upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:3000;
}
server {
    client_max_body_size 100M;
    listen 80;

    # Compressão — reduz o tamanho das respostas (HTML/JSON/CSS/JS) sem alterar o
    # conteúdo, só os bytes trafegados. Mesmo conteúdo final, só chega mais rápido.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff2;

    location ~ ^/(api|admin|rdstation) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Repassa o esquema (http/https) recebido do proxy/LB externo — este Nginx só
        # escuta em HTTP (porta 80) internamente, então $scheme aqui seria sempre "http"
        # e mascararia o HTTPS real do visitante, quebrando redirect_uri do OAuth e afins.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /static/ {
        alias /var/www/html/static/;
        # Nomes de arquivo já têm hash (whitenoise CompressedManifestStaticFilesStorage),
        # então um arquivo com uma URL nunca muda de conteúdo — pode cachear "pra sempre".
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Serve os .gz que o whitenoise já gera no collectstatic, sem recomprimir.
        gzip_static on;
    }
    location /media/ {
        alias /var/www/html/media/;
        # Mídia/renditions raramente mudam depois de publicadas, mas o nome do arquivo
        # não é hash-versionado — cache moderado em vez de "immutable".
        add_header Cache-Control "public, max-age=604800";
    }
    
    # Rota direta pro Backend (Foge do Next.js)
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Repassa o esquema (http/https) recebido do proxy/LB externo — este Nginx só
        # escuta em HTTP (porta 80) internamente, então $scheme aqui seria sempre "http"
        # e mascararia o HTTPS real do visitante, quebrando redirect_uri do OAuth e afins.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
