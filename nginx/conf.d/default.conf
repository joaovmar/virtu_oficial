upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:3000;
}
server {
    client_max_body_size 100M;
    listen 80;
    location ~ ^/(api|admin|rdstation) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Repassa o esquema (http/https) recebido do proxy/LB externo — este Nginx só
        # escuta em HTTP (porta 80) internamente, então $scheme aqui seria sempre "http"
        # e mascararia o HTTPS real do visitante, quebrando redirect_uri do OAuth e afins.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /static/ {
        alias /var/www/html/static/;
    }
    location /media/ {
        alias /var/www/html/media/;
    }
    
    # Rota direta pro Backend (Foge do Next.js)
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Repassa o esquema (http/https) recebido do proxy/LB externo — este Nginx só
        # escuta em HTTP (porta 80) internamente, então $scheme aqui seria sempre "http"
        # e mascararia o HTTPS real do visitante, quebrando redirect_uri do OAuth e afins.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
